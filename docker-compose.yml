version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: resqnet_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./resqnet.db
      - SECRET_KEY=resqnet-disaster-resilient-emergency-key-2026
      - GATEWAY_API_KEY=resqnet-gateway-token-secret
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-2.0-flash
    volumes:
      - ./data:/app/data
      - ./uploads:/app/backend/uploads
    networks:
      - resqnet_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: resqnet_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - resqnet_net

networks:
  resqnet_net:
    driver: bridge
